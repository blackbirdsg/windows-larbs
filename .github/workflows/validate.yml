name: Validate desktop profile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        shell: powershell
        run: .\test-desktop-profile.ps1 -SourceOnly
      - name: Render portable runtime
        shell: powershell
        run: .\install.ps1 -RuntimeOnly -InstallRoot "$env:RUNNER_TEMP\larbs-windows" -SettingsPath .\settings.example.psd1
      - name: Test native ChatGPT window helpers
        shell: powershell
        run: .\tests\test-codex-native-window.ps1
      - name: Test Codex bar usage helpers
        shell: powershell
        run: .\tests\test-codex-usage.ps1
      - name: Test Codex bar rendering
        run: node .\tests\test-codex-bar.cjs
