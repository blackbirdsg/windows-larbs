general:
  startup_commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-start-zebar.ps1"']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-start-zebar.ps1"']
  focus_follows_cursor: false
  toggle_workspace_on_refocus: true
  cursor_jump:
    enabled: true
    trigger: 'window_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    top: '48px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '{{ACCENT_BASE}}'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#504945'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
    display_name: '{{WORKSPACE_1_NAME}}'
  - name: '2'
    display_name: '{{WORKSPACE_2_NAME}}'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }
      - window_process: { equals: 'powershell' }
        window_title: { equals: 'CodexVimiumOverlay' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+r']

keybindings:
  - commands: ['focus --direction left']
    bindings: ['alt+h', 'alt+left']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-cycle-window.ps1" next']
    bindings: ['alt+j']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name KiCad']
    bindings: ['alt+k']
  - commands: ['focus --direction down']
    bindings: ['alt+down']
  - commands: ['focus --direction up']
    bindings: ['alt+up']
  - commands: ['focus --direction right']
    bindings: ['alt+l', 'alt+right']

  - commands: ['move --direction left']
    bindings: ['alt+shift+h', 'alt+shift+left']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j', 'alt+shift+down']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k', 'alt+shift+up']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l', 'alt+shift+right']

  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+r']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-claude.ps1"']
    bindings: ['alt+v']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-vpn.ps1"']
    bindings: ['alt+shift+v']
  - commands: ['wm-cycle-focus']
    bindings: ['alt+space']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  - commands: ['toggle-tiling']
    bindings: ['alt+shift+t']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-openproject.ps1"']
    bindings: ['alt+m']
  - commands: ['close']
    bindings: ['alt+q', 'alt+shift+q']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+w']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-terminal.ps1"']
    bindings: ['alt+enter']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name GoogleEarth']
    bindings: ['alt+t']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-yazi.ps1"']
    bindings: ['alt+e']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-open-guide.ps1"']
    bindings: ['alt+g']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-gitlab.ps1"']
    bindings: ['alt+shift+g']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name Wireshark']
    bindings: ['alt+w']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-codex.ps1"']
    bindings: ['alt+c']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name PowerToysRun']
    bindings: ['alt+d']

  - commands: ['focus --prev-active-workspace']
    bindings: ['alt+comma']
  - commands: ['focus --next-active-workspace']
    bindings: ['alt+period']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name BambuStudio']
    bindings: ['alt+b']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-browser-window.ps1"']
    bindings: ['alt+shift+b']

  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-onshape.ps1"']
    bindings: ['alt+o']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name QGIS']
    bindings: ['alt+i']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-screenshot-active-window.ps1"']
    bindings: ['alt+s']
  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-launch-app.ps1" -Name OBS']
    bindings: ['alt+p']

  - commands: ['shell-exec --hide-window powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "{{PROFILE_ROOT}}\glazewm\glazewm-focus-pm.ps1"']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
